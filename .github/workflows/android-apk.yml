name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    env:
      VITE_API_URL: https://pramod-chess-backend.onrender.com
      VITE_SOCKET_URL: https://pramod-chess-backend.onrender.com

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install web and Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Generate Android native project
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-PROXI-CHESS-Android-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare public APK download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk THE-PROXI-CHESS.apk

      - name: Publish latest Android APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: THE PROXI CHESS - Latest Android APK
          body: Latest installable Android debug build of THE PROXI CHESS. This is a direct APK download for testing.
          files: client/THE-PROXI-CHESS.apk
          overwrite_files: true
          make_latest: true
          prerelease: false
